name: Apply BladeRGB 1.3.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1.3.2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply BladeRGB 1.3.2 patch
        run: python tools/apply_v1_3_2.py
      - name: Validate Python
        run: python -m compileall -q .
      - name: Validate QML sanity
        run: python qml_sanity.py
      - name: Commit release
        run: |
          rm -f tools/apply_v1_3_2.py
          rm -f .github/workflows/apply-v1.3.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: BladeRGB 1.3.2 palette timing and FPS"
          git push
