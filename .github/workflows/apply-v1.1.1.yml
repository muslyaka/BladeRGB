name: Apply BladeRGB 1.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1.1.1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply autosave patch
        run: python tools/apply_v1_1_1.py || true
      - name: Finish reactive RGB patch
        run: python tools/finish_v1_1_1.py
      - name: Validate Python
        run: python -m compileall -q .
      - name: Validate QML
        run: python qml_sanity.py
      - name: Commit release
        run: |
          rm -f tools/apply_v1_1_1.py
          rm -f tools/finish_v1_1_1.py
          rm -f .github/workflows/apply-v1.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist lighting state and reactive RGB"
          git push
